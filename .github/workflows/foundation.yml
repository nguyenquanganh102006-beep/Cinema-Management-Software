name: Foundation checks
on:
  push:
    branches: [develop, main, feature/foundation]
  pull_request:
jobs:
  foundation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.1
        env:
          POSTGRES_DB: cinema_test
          POSTGRES_USER: cinema_test
          POSTGRES_PASSWORD: ci-test-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U cinema_test -d cinema_test"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      DEBUG: 'false'
      DB_TEST_URL: jdbc:postgresql://localhost:5432/cinema_test
      DB_TEST_USERNAME: cinema_test
      DB_TEST_PASSWORD: ci-test-only-password
      DB_URL: jdbc:postgresql://localhost:5432/cinema_test
      DB_USERNAME: cinema_test
      DB_PASSWORD: ci-test-only-password
      JWT_SECRET: ci-only-jwt-secret-at-least-32-bytes-not-for-deployment
      SPRING_PROFILES_ACTIVE: local
      DEMO_PASSWORD: CI-demo-test-only-password
      DEMO_MANAGER_PIN: '123456'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Backend verify
        working-directory: backend
        run: bash mvnw -B -ntp verify
        env:
          SPRING_PROFILES_ACTIVE: test
      - name: Frontend build and unit tests
        working-directory: frontend
        run: |
          npm install --global npm@11.10.1
          npm ci
          npm run build
          npm test
          npx playwright install --with-deps chromium
      - name: Start backend
        run: |
          java -jar backend/target/cms-0.1.0-SNAPSHOT.jar > /tmp/cinema-backend.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:8080/v3/api-docs > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/cinema-backend.log
          exit 1
      - name: Browser E2E
        working-directory: frontend
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: foundation-test-results
          path: |
            backend/target/surefire-reports
            frontend/test-results
