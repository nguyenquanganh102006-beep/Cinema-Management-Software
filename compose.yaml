services:
  postgres:
    image: postgres:18.1
    environment:
      POSTGRES_DB: cinema_db
      POSTGRES_USER: ${DB_USERNAME:?Set DB_USERNAME in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - cinema_postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d cinema_db"]
      interval: 5s
      timeout: 3s
      retries: 12
volumes:
  cinema_postgres:
