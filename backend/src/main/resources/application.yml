server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
spring:
  application:
    name: cinema-management
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  jackson:
    deserialization:
      fail-on-unknown-properties: true
app:
  portals:
    manager: ${PORTAL_MANAGER_URL:http://localhost:3001}
    staff: ${PORTAL_STAFF_URL:http://localhost:3002}
    customer: ${PORTAL_CUSTOMER_URL:http://localhost:3003}
  jwt:
    secret: ${JWT_SECRET}
    ttl-seconds: ${JWT_TTL_SECONDS:1800}
  cors-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3001,http://localhost:3002,http://localhost:3003}
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
logging:
  level:
    org.springframework.web: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN
